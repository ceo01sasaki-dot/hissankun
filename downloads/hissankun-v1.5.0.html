<body><main id="app" aria-label="ひっ算おたすけ君">
<header><h1>ひっ<ruby>算<rt>さん</rt></ruby>おたすけ<ruby>君<rt>くん</rt></ruby></h1><nav aria-label="学習の操作"><button class="gloss gray" id="undo">〈 もどす</button><button class="gloss gray" id="redo">すすむ 〉</button><button class="gloss sand" id="reset">↶ リセット</button><button class="gloss purple" id="settings">⚙ せってい</button></nav></header>
<section class="workspace"><div class="paper-area"><div id="paper"><svg id="grid" viewBox="0 0 840 616" role="img" aria-label="筆算を書く方眼紙"></svg><div id="entry" aria-label="現在の入力"></div></div><div class="paper-foot"><span>ver 1.5.0 · ささっきー</span><span>（5mm方眼）</span></div></div>
<aside><div class="bubble" aria-live="polite"><div id="operand-legend" class="operand-legend" hidden><span>わられる数</span><span>わる数</span></div><div id="division-flow" class="division-flow" aria-label="わり算のじゅんばん" hidden><span data-phase="quotient">たてる</span><span data-phase="product">かける</span><span data-phase="subtract">ひく</span><span data-phase="bring-down">おろす</span></div><div id="message"></div><div id="actions"></div></div><div class="controls"><div class="mascot" id="mascot" role="img" aria-label="水色の小鳥の先生"><svg viewBox="0 0 180 210"><path d="M42 113Q13 100 17 130Q16 150 46 151M137 111Q164 97 163 120Q168 142 141 150" fill="#b6e3e6" stroke="#4b8f9e" stroke-width="3"/><path d="M55 168L49 183L70 177M109 175L130 184L123 166" fill="#f5c579" stroke="#aa8455" stroke-width="3"/><path d="M46 65Q36 37 58 44L77 59Q88 22 99 51Q126 30 130 59Q155 78 151 117Q150 174 93 177Q31 175 30 126Q26 89 46 65Z" fill="#d8f1ee" stroke="#4b8f9e" stroke-width="3"/><ellipse cx="91" cy="140" rx="37" ry="30" fill="#f6fcf5"/><ellipse cx="64" cy="103" rx="6" ry="10" fill="#325464"/><ellipse cx="117" cy="103" rx="6" ry="10" fill="#325464"/><circle cx="66" cy="100" r="2" fill="white"/><circle cx="119" cy="100" r="2" fill="white"/><path d="M80 114Q91 103 102 114L91 126Z" fill="#edb55f" stroke="#aa8455" stroke-width="2"/><ellipse cx="48" cy="119" rx="10" ry="6" fill="#efbec6"/><ellipse cx="133" cy="119" rx="10" ry="6" fill="#efbec6"/></svg><span>いっしょに やろう！</span></div><div class="keypad" id="keypad" aria-label="数字と計算のキーボード"></div></div></aside></section>
<footer><span id="status">じぶんの ペースで、ひとつずつ。</span><span>つくった人：ささっきー</span></footer></main>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog><script>
(function(){
"use strict";
const symbols={'+':'＋','-':'−','*':'×','/':'÷'};
const places=['一','十','百','千','万','十万','百万','千万'];
function parseFormula(value){
 const m=/^(\d{1,4})([+\-*/])(\d{1,4})$/.exec(value);
 if(!m)return {error:'数 → ＋・−・×・÷ → 数 のじゅんに 入れてね。'};
 const a=Number(m[1]),op=m[2],b=Number(m[3]);
 if(op==='*'&&m[3].length>3)return {error:'かける数は 3けたまでに してね。'};
 if(op==='/'&&m[3].length>2)return {error:'わる数は 2けたまでに してね。'};
 if(op==='-'&&a<b)return {error:'大きい数から 小さい数を ひいてね。'};
 if(op==='/'&&b===0)return {error:'0で わることは できないよ。'};
 if(op==='/'&&a<b)return {error:'わられる数を わる数より 大きくしてね。'};
 return {a,b,op};
}
function buildPlan({a,b,op},settings={}){
 const base=[],steps=[];
 const put=(list,text,row,right,kind='digit')=>[...String(text)].reverse().forEach((text,k)=>list.push({row,col:right-k,text,kind}));
 const line=(list,row,left,right)=>list.push({row,col:left,end:right,kind:'line'});
 const A=String(a),B=String(b),L=Math.max(A.length,B.length),R=op==='*'?A.length+B.length+1:L+2;
 const digit=(s,k)=>Number(s[s.length-1-k]||0);
 const carryMark=(row,col,text)=>({row:settings.carry==='down'?row:2,col,text,kind:settings.carry==='down'?'carry-down':'carry'});
 const step=(expected,row,col,message,marks=[],highlight=[],extra={})=>steps.push({expected,row,col,message,marks,highlight,...extra});
 if(op!=='/'){
  put(base,A,3,R);put(base,B,4,R);base.push({row:4,col:R-L,text:symbols[op]});line(base,4,R-L,R);
 }
 if(op==='+'){
  let carry=0;
  for(let k=0;k<L;k++){
   const x=digit(A,k),y=digit(B,k),v=x+y+carry,marks=[];
   const msg=`${places[k]}の位。${x}＋${y}${carry?'＋'+carry+'（くりあがり）':''}を しよう。`;
   put(marks,k===L-1?v:v%10,5,R-k,'answer');
   if(v>=10&&k<L-1)marks.push(carryMark(5,R-k-1,1));
   step(v,5,R-k,msg,marks,[[3,R-k],[4,R-k]],{hint:`${x}こに ${y}こ${carry?'と くりあがりの '+carry+'こ':''}を あわせよう。10こで ひとまとまりだよ。`,success:v>=10?`${v}だね！ ${v%10}を かいて、1を くりあげよう。`:'せいかい！',parts:[x,y,carry]});carry=Math.floor(v/10);
  }
 }
 if(op==='-'){
  const cur=[...A].reverse().map(Number);
  for(let k=0;k<A.length;k++){
   const y=digit(B,k),marks=[];let borrowed=false;
   if(cur[k]<y){let j=k+1;while(cur[j]===0)j++;cur[j]--;for(let z=j-1;z>k;z--)cur[z]=9;cur[k]+=10;borrowed=true;
    for(let z=k;z<=j;z++)marks.push({row:settings.borrow==='side'?3:2,col:R-z,text:cur[z],kind:settings.borrow==='side'?'borrow-side':'borrow'});
   }
   const x=cur[k],v=x-y;if(k<String(a-b).length)put(marks,v,5,R-k,'answer');
   step(v,5,R-k,`${places[k]}の位。${borrowed?'左の位から 1を かりて、':''}${x}−${y}を しよう。`,marks,[[3,R-k],[4,R-k]],{hint:`${borrowed?'1つ上の位の 1は、この位の 10と 同じだよ。':''}${x}こから ${y}こを とると いくつかな？`,parts:[x,y],borrowed});
  }
 }
 if(op==='*'){
  const partials=[];
  for(let j=0;j<B.length;j++){
   const y=digit(B,j),row=5+j;let carry=0;partials.push(a*y*10**j);
   for(let k=0;k<A.length;k++){
    const x=digit(A,k),v=x*y+carry,marks=[];put(marks,k===A.length-1?v:v%10,row,R-k-j,'answer');
    if(k===0&&j>0)marks.unshift({kind:'clear-carry'});
    if(v>=10&&k<A.length-1)marks.push(carryMark(row,R-k-j-1,Math.floor(v/10)));
    step(v,row,R-k-j,`${places[j]}の位の ${y}を かけよう。${x}×${y}${carry?'＋'+carry+'（くりあがり）':''}は？`,marks,[[3,R-k],[4,R-j]],{hint:`${x}が ${y}こ分だよ。${carry?'さいごに '+carry+'を たそう。':''}`,parts:[x,y,carry],table:{base:y,factor:x,carry}});carry=Math.floor(v/10);
   }
   for(let z=0;z<j;z++)steps.at(-1).marks.push({row,col:R-z,text:0,kind:'answer'});
  }
  if(B.length>1){steps.at(-1).marks.push({kind:'clear-carry'});const row=5+B.length;line(steps.at(-1).marks,row-1,R-String(a*b).length,R);let carry=0;
   for(let k=0;k<String(a*b).length;k++){
    const ds=partials.map(n=>digit(String(n),k)),v=ds.reduce((s,n)=>s+n,carry),marks=[];put(marks,k===String(a*b).length-1?v:v%10,row,R-k,'answer');
    if(v>=10&&k<String(a*b).length-1)marks.push(carryMark(row,R-k-1,Math.floor(v/10)));
    step(v,row,R-k,`さいごに たそう。${ds.join('＋')}${carry?'＋'+carry:''}は？`,marks,ds.map((_,j)=>[5+j,R-k]),{hint:'位を そろえて、右から じゅんに たそう。'});carry=Math.floor(v/10);
   }
  }
 }
 if(op==='/'){
  // The divisor touches the bracket; each dividend digit occupies one cell.
  const firstCol=B.length+2,lastCol=firstCol+A.length-1;
  put(base,B,2,firstCol-1);put(base,A,2,lastCol);
  base.push({row:2,col:firstCol,end:lastCol,kind:'division'});
  const cells=(row,right,length)=>Array.from({length},(_,i)=>[row,right-i]);
  const divisorCells=cells(2,firstCol-1,B.length);
  const explain=(message,phase='intro',highlight=[])=>steps.push({type:'info',phase,message,highlight,marks:[]});
  const input=(expected,row,col,phase,message,marks,highlight,extra={})=>{
   const width=String(expected).length;
   step(expected,row,col,message,marks,highlight,{type:'input',phase,width,maxLength:width,...extra});
  };
  explain('わり算は「たてる → かける → ひく → おろす」を くりかえすよ。');
  let prefixLength=1;
  while(Number(A.slice(0,prefixLength))<b)prefixLength++;
  let working=Number(A.slice(0,prefixLength)),workingRow=2,productRow=3;
  if(prefixLength>1)explain(`${A.slice(0,prefixLength-1)}では ${b}で われないね。${working}で 考えよう。`,'intro',cells(2,firstCol+prefixLength-1,prefixLength));
  for(let k=prefixLength-1;k<A.length;k++){
   const col=firstCol+k,quotient=Math.floor(working/b),hasNext=k<A.length-1;
   input(quotient,1,col,'quotient',`たてる：${working}÷${b}の こたえを、${A[k]}の 上に たてよう。`,
    [{row:1,col,text:quotient,kind:'answer'}],cells(workingRow,col,String(working).length).concat(divisorCells),
    {hint:`${b}×□ が ${working}を こえない、いちばん 大きい □を さがそう。`,table:{base:b,factor:quotient,dividend:working},dividend:working,divisor:b,success:quotient===0?`${working}は ${b}より 小さいから、商に 0を たてるよ。`:undefined});
   // A zero belongs in the quotient. Do not introduce a spurious 0×b / subtraction row.
   if(quotient!==0){
    const product=quotient*b,remainder=working-product,productMarks=[];
    put(productMarks,product,productRow,col,'working');
    line(productMarks,productRow,col-Math.max(String(working).length,String(product).length)+1,col);
    input(product,productRow,col,'product',`かける：たてた ${quotient}と、わる数の ${b}を かけよう。`,productMarks,[[1,col],...divisorCells],
     {hint:`${quotient}×${b}の こたえを、位を そろえて 下に かこう。`,table:{base:b,factor:quotient},success:`${quotient}×${b}＝${product} だね。`});
    const remainderMarks=[];
    if(remainder!==0||!hasNext)put(remainderMarks,remainder,productRow+1,col,'working');
    input(remainder,productRow+1,col,'subtract',`ひく：${working}−${product}を しよう。`,remainderMarks,
     cells(workingRow,col,String(working).length).concat(cells(productRow,col,String(product).length)),
     {hint:`${working}から ${product}を ひこう。のこりは ${b}より 小さくなるよ。`,
      success:remainder===0&&hasNext?'0だね。とちゅうの 0は かかずに、つぎの数を おろそう。':undefined});
    working=remainder;workingRow=productRow+1;productRow+=2;
   }
   if(hasNext){
    const nextDigit=Number(A[k+1]),nextValue=working*10+nextDigit,marks=[];
    if(nextValue!==0)marks.push({row:workingRow,col:col+1,text:nextDigit,kind:'working'});
    input(nextDigit,workingRow,col+1,'bring-down',`おろす：つぎの ${nextDigit}を 下に おろそう。`,marks,[[2,col+1]],
     {hint:'上の数字を、そのまま 同じ位の 下へ おろそう。',targetDividend:(working>0?cells(workingRow,col,String(working).length):[]).concat([[2,col+1]]),arrow:{from:[2,col+1],to:[workingRow,col+1]},
      success:nextValue===0?'0を おろしたね。つぎは 商に 0を たてよう。':`${nextValue}に なったね。つぎの商を 考えよう。`});
    working=nextValue;
   }
  }
  explain(a%b===0?'あまりは 0。わりきれたね！':`のこりの ${a%b}は ${b}より 小さいから おわり。あまりは ${a%b}だよ。`,'finish',cells(workingRow,lastCol,String(a%b).length));
  // Keep the actual operands colored throughout every division stage.
  let activeDividend=cells(2,firstCol+prefixLength-1,prefixLength);
  for(const stage of steps){
   if(stage.phase==='finish')activeDividend=stage.highlight;
   if(stage.phase==='bring-down')activeDividend=stage.targetDividend;
   if(stage.phase==='quotient')activeDividend=stage.dividend===0?[[2,stage.col]]:cells(stage.highlight[0][0],stage.col,String(stage.dividend).length);
   stage.operandHighlights={dividend:activeDividend.map(cell=>[...cell]),divisor:divisorCells.map(cell=>[...cell])};
  }
 }

 const result=op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:Math.floor(a/b);
 return {base,steps,result,remainder:op==='/'?a%b:0};
}

// Resume before scheduling: mobile browsers can suspend/interupt a context
// after switching tabs or returning from another app.
function createSoundPlayer({enabled=()=>true,createContext=()=>new (window.AudioContext||window.webkitAudioContext)()}={}){
 let context;
 return async function play(kind='tap'){
  if(!enabled())return;
  try{
   if(!context||context.state==='closed')context=createContext();
   const active=context;
   if(active.state!=='running')await active.resume();
   if(!enabled()||active.state!=='running')return;
   const now=active.currentTime+.01;
   const notes=kind==='ok'?[659,880]:kind==='clear'?[523,659,784,1047]:kind==='error'?[220,185]:[440];
   notes.forEach((frequency,i)=>{
    const oscillator=active.createOscillator(),gain=active.createGain(),start=now+i*.11;
    oscillator.type='sine';oscillator.frequency.value=frequency;
    gain.gain.setValueAtTime(.0001,start);
    gain.gain.exponentialRampToValueAtTime(.12,start+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,start+.16);
    oscillator.connect(gain).connect(active.destination);
    oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
    oscillator.start(start);oscillator.stop(start+.18);
   });
  }catch{/* Sound is optional; input must continue if a browser blocks audio. */}
 };
}

const $=id=>document.getElementById(id),storageKey='sasakky-hissan-v1';
let settings={carry:'up',borrow:'up',sound:true},state={formula:'',problem:null,index:0,input:''},history=[],future=[],plan=null,feedback='',feedbackType='',timer;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const display=s=>[...s].map(c=>symbols[c]||c).join('');
const copy=s=>structuredClone(s);
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved){settings={...settings,...saved.settings};if(saved.state&&typeof saved.state.formula==='string'){state=saved.state;if(state.problem){const p=parseFormula(`${state.problem.a}${state.problem.op}${state.problem.b}`);if(p.error)throw Error();state.problem=p;plan=buildPlan(p,settings);if(p.op==='/'&&state.divisionVersion!==2){state.index=0;state.input='';state.divisionVersion=2;}if(!Number.isInteger(state.index)||state.index<0||state.index>plan.steps.length)state.index=0;}}}}catch{state={formula:'',problem:null,index:0,input:''};plan=null;}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({settings,state}));}catch{}}
function snapshot(){history.push(copy(state));if(history.length>200)history.shift();future=[];}
const sound=createSoundPlayer({enabled:()=>settings.sound});

function stopFeedback(){clearTimeout(timer);feedback='';feedbackType='';}

function fail(text){stopFeedback();feedback=text;feedbackType='error';sound('error');render({paper:false});animate('entry','shake');}
const current=()=>plan?.steps[state.index];
function render({paper=true}={}){
 const c=current();
 if(paper){
 const svg=[];
 svg.push('<defs><marker id="down-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#258b9e"/></marker><pattern id="small" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#83c6ee" stroke-width="1" stroke-dasharray="2 3"/></pattern><pattern id="big" width="56" height="56" patternUnits="userSpaceOnUse"><rect width="56" height="56" fill="url(#small)"/><path d="M56 0H0V56" fill="none" stroke="#299dd5" stroke-width="1.5"/></pattern></defs><rect width="840" height="616" fill="url(#big)"/>');
 for(let n=5;n<=25;n+=5){svg.push(`<text x="${n*28}" y="-7" text-anchor="middle" fill="#2997c8" font-size="13">${n}</text><text x="${n*28}" y="634" text-anchor="middle" fill="#2997c8" font-size="13">${n}</text>`);}
 for(let n=5;n<=20;n+=5)svg.push(`<text x="-8" y="${n*28+4}" text-anchor="middle" fill="#2997c8" font-size="13">${n}</text><text x="850" y="${n*28+4}" fill="#2997c8" font-size="13">${n}</text>`);
 svg.push('<text x="28" y="20" text-anchor="middle" font-size="12" fill="#27334a">しき</text><text x="28" y="50" text-anchor="middle" font-size="35" font-weight="bold" fill="#27334a">式</text>');
 let marks=[];
 if(plan){marks=[...plan.base];for(let i=0;i<state.index;i++)marks.push(...plan.steps[i].marks);if(c?.borrowed)marks.push(...c.marks.filter(m=>m.kind?.startsWith('borrow')));const cleaned=[];for(const m of marks){if(m.kind==='clear-carry'){for(let j=cleaned.length-1;j>=0;j--)if(['carry','carry-down'].includes(cleaned[j].kind))cleaned.splice(j,1);}else{const old=cleaned.findIndex(x=>x.row===m.row&&x.col===m.col&&x.kind===m.kind);if(old>=0)cleaned.splice(old,1);cleaned.push(m);}}marks=cleaned;}
 if(c)for(const [row,col]of (c.highlight||[]).filter(([r,k])=>!Object.values(c.operandHighlights||{}).flat().some(([a,b])=>r===a&&k===b)))svg.push(`<rect x="${col*56+2}" y="${row*56+2}" width="52" height="52" rx="6" fill="#ffdc6270"/>`);
 if(c?.operandHighlights)for(const [role,cells]of Object.entries(c.operandHighlights))for(const [row,col]of cells){
  const fill=role==='dividend'?'#ffe16b':'#9ae1f5',stroke=role==='dividend'?'#bf8b00':'#1688a9';
  svg.push(`<rect data-operand="${role}" data-row="${row}" data-col="${col}" x="${col*56+1}" y="${row*56+1}" width="54" height="54" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`);
 }
 const formula=plan?`${state.problem.a}${state.problem.op}${state.problem.b}`:state.formula;
 if(plan)[...display(formula)].forEach((text,k)=>marks.push({row:0,col:k+1,text}));
 for(const m of marks){const x=m.col*56,y=m.row*56;if(m.kind==='line'){svg.push(`<path d="M${x} ${y+57}H${(m.end+1)*56}" stroke="#283344" stroke-width="3" stroke-linecap="round"/>`);continue;}if(m.kind==='division'){svg.push(`<path data-mark="division" d="M${x-2} ${y}H${(m.end+1)*56-4}M${x-2} ${y}Q${x+18} ${y+28} ${x-2} ${y+56}" fill="none" stroke="#283344" stroke-width="3" stroke-linecap="round"/>`);continue;}
 const small=['carry','carry-down','borrow','borrow-side'].includes(m.kind),side=m.kind?.endsWith('side')||m.kind==='carry-down';svg.push(`<text data-kind="${m.kind||'digit'}" data-row="${m.row}" data-col="${m.col}" x="${x+(side?10:28)}" y="${y+(side?18:small?49:46)}" text-anchor="middle" font-size="${small?23:43}" font-weight="${small?600:700}" fill="${small?'#258b9e':['answer','working'].includes(m.kind)?'#244a91':'#263344'}">${escape(m.text)}</text>`);
 }
 if(c?.arrow&&c.arrow.to[0]>c.arrow.from[0]){
  const x=c.arrow.from[1]*56+49,y1=(c.arrow.from[0]+1)*56+5,y2=c.arrow.to[0]*56+20;
  svg.push(`<path data-mark="bring-down-arrow" d="M${x} ${y1}V${y2}" fill="none" stroke="#258b9e" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#down-arrow)"/>`);
 }
 if(plan&&state.problem.op==='/'&&state.index===plan.steps.length){
  const quotientCells=plan.steps.filter(s=>s.phase==='quotient');
  const left=quotientCells[0].col*56,right=(quotientCells.at(-1).col+1)*56;
  svg.push(`<rect data-mark="quotient-result" x="${left+2}" y="${quotientCells[0].row*56+2}" width="${right-left-4}" height="52" rx="20" fill="none" stroke="#ef6274" stroke-width="3"/>`);
 }
 $('grid').innerHTML=svg.join('');
 }
 const done=plan&&state.index>=plan.steps.length;
 $('entry').classList.toggle('hidden',!!done||c?.type==='info');
 $('entry').classList.toggle('numeric',!!plan);
 const row=c?.row||0,col=c?.col||1,width=plan?(c?.width||Math.max(1,state.input.length)):9;
 Object.assign($('entry').style,{top:(row/11*100)+'%',left:((col-(plan?width-1:0))/15*100)+'%',width:(width/15*100)+'%'});
 $('entry').style.setProperty('--input-cells',width);
 $('entry').setAttribute('aria-label','現在の入力：'+(plan?state.input:display(state.formula)));
 if(plan){$('entry').innerHTML=Array.from({length:width-state.input.length},()=>'<span class="input-digit" aria-hidden="true"></span>').join('')+[...state.input].map(d=>`<span class="input-digit">${escape(d)}</span>`).join('');}
 else $('entry').textContent=display(state.formula);
 let message=feedback||(!plan?(state.formula?'入れたら「けってい」を おそう。':'まず <ruby>赤<rt>あか</rt></ruby>い わくに <ruby>式<rt>しき</rt></ruby>を <ruby>入<rt>い</rt></ruby>れよう'):done?'ぜんぶ できたね！<br>よく がんばりました。':escape(c.message));
 $('message').innerHTML=`${plan&&!done?`<span class="progress">${state.index+1} / ${plan.steps.length} ステップ</span>`:''}<span class="${feedbackType}">${message}</span>`;
 $('actions').innerHTML=done?'<button class="gloss green" data-action="new">あたらしい式</button><button class="gloss gray" data-action="retry">もういちど</button>':c?.type==='info'?'<button class="gloss green" data-action="next">つぎへ 〉</button>':plan?'<button class="gloss pink" data-action="hint">アシストを みる？</button>':'';
 $('undo').disabled=history.length===0;$('redo').disabled=future.length===0;
 document.querySelectorAll('[data-key]').forEach(button=>{button.disabled=!!done||(!!plan&&'+-*/'.includes(button.dataset.key))||(c?.type==='info'&&button.dataset.key!=='Enter');});
 const legend=$('operand-legend');legend.hidden=!plan||state.problem.op!=='/'||!!done;
 const flow=$('division-flow');flow.hidden=!plan||state.problem.op!=='/'||!!done;
 for(const badge of flow.querySelectorAll('[data-phase]'))badge.classList.toggle('active',badge.dataset.phase===c?.phase);
 $('status').textContent=plan?(done?`${display(`${state.problem.a}${state.problem.op}${state.problem.b}`)} ＝ ${plan.result}${plan.remainder?' あまり '+plan.remainder:''}`:'学習のとちゅうも 自動で 保存されます。'):'じぶんの ペースで、ひとつずつ。';save();
}
function key(k){
 if($('dialog').open)return;
 if(k==='Enter'){confirm();return;}
 if(plan&&(state.index>=plan.steps.length||current()?.type==='info'))return;
 if(k==='Backspace'){if(!(plan?state.input:state.formula))return;snapshot();if(plan)state.input=state.input.slice(0,-1);else state.formula=state.formula.slice(0,-1);stopFeedback();render({paper:false});sound();return;}
 if(!/^[0-9+\-*/]$/.test(k))return;
 if(plan){if(!/^\d$/.test(k))return;if(state.input.length>=(current()?.maxLength||4))return;snapshot();state.input+=k;}
 else{
  const m=/^(\d*)([+\-*/]?)(\d*)$/.exec(state.formula);if(!m)return;
  let [,a,op,b]=m;
  if('+-*/'.includes(k)){if(!a)return fail('さきに 数を 入れてね。');if(op&&b)return fail('計算の きごうは 1つだけだよ。');op=k;}
  else if(!op){if(a.length>=4)return fail('さいしょの数は 4けたまでだよ。');a=a==='0'?k:a+k;}
  else{const lim=op==='*'?3:op==='/'?2:4;if(b.length>=lim)return fail(`うしろの数は ${lim}けたまでだよ。`);b=b==='0'?k:b+k;}
  snapshot();state.formula=a+op+b;
 }
 stopFeedback();render({paper:false});sound();
}
function confirm(){
 if(!plan){const p=parseFormula(state.formula);if(p.error)return fail(p.error);snapshot();state.problem=p;state.divisionVersion=2;state.index=0;state.input='';plan=buildPlan(p,settings);stopFeedback();sound('ok');render();return;}
 const c=current();if(!c)return;if(c.type==='info'){snapshot();state.index++;state.input='';stopFeedback();render();if(!current()){sound('clear');confetti();completion();}else sound();return;}if(state.input==='')return fail('赤いわくに こたえを 入れてね。');
 if(Number(state.input)!==c.expected){
  let message='おしい！ もういちど 考えてみよう。';
  if(c.phase==='quotient')message=Number(state.input)*c.divisor>c.dividend?'商が 大きすぎるよ。かけた数が、わられる数を こえないようにしよう。':'商が 小さいみたい。もう1つ 大きい数を たてられるかな？';
  snapshot();state.input='';return fail(message);
 }
 snapshot();state.index++;state.input='';feedback=c.success||'せいかい！ そのちょうし！';feedbackType='success';sound('ok');animate('mascot','hop');render();clearTimeout(timer);
 if(!current()){sound('clear');confetti();timer=setTimeout(()=>{stopFeedback();render();completion();},800);}else timer=setTimeout(()=>{stopFeedback();render();},1100);
}
function reset(){snapshot();stopFeedback();state={formula:'',problem:null,index:0,input:''};plan=null;render();}
function restore(s){state=s;plan=state.problem?buildPlan(state.problem,settings):null;stopFeedback();render();}
function modal(html){$('dialog-content').innerHTML=html;$('dialog').showModal();}
function close(){ $('dialog').close(); }
function completion(){modal(`<div class="celebrate">✦ できたね！ ✦</div><h2 id="dialog-title">よく がんばりました！</h2><p class="answer-text">${display(`${state.problem.a}${state.problem.op}${state.problem.b}`)} ＝ ${plan.result}${plan.remainder?'<br>あまり '+plan.remainder:''}</p><button class="gloss green close" data-action="new">あたらしい式</button><button class="gloss gray close" data-action="close">このまま みる</button>`);}
function confetti(){const el=document.createElement('div');el.className='confetti';for(let i=0;i<50;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${['#6bc6ce','#f2bb5c','#b7a0df','#f3a7b7'][i%4]};animation-delay:${Math.random()*.7}s`;el.append(p);}document.body.append(el);setTimeout(()=>el.remove(),4000);}
function showSettings(){
 const group=(label,name,values)=>`<h3>${label}</h3><div class="options">${values.map(([v,t])=>`<button data-setting="${name}" data-value="${v}" aria-pressed="${String(settings[name])===v}">${t}</button>`).join('')}</div>`;
 modal(`<h2 id="dialog-title">⚙ せってい</h2>${group('くりあがりを かく場所','carry',[['up','うえの だん'],['down','こたえの マス']])}${group('くりさがりを かく場所','borrow',[['up','うえの だん'],['side','数の みぎうえ']])}${group('こうかおん','sound',[['true','あり ♪'],['false','なし']])}<button class="gloss purple close" data-action="close">とじる</button><p class="credit">ひっ算おたすけ君 ver 1.5.0<br>つくった人：ささっきー</p>`);
}
function hint(){
 const c=current();if(!c)return;
 let visual='';
 if(c.table){
  const {base,factor,carry=0,dividend}=c.table;
  const first=Math.max(0,factor-1),last=Math.min(10,factor+1);
  visual=`<section class="times-hint" aria-label="${base}のだんのヒント"><h3>${base}の だん${base<=9?'（九九）':'（かけ算のひょう）'}</h3>${Array.from({length:last-first+1},(_,i)=>{const n=first+i;return `<div class="times-row ${n===factor?'current':''}"${n===factor?' aria-current="true"':''}>${base} × ${n} ＝ <strong>${base*n}</strong></div>`;}).join('')}${carry?`<p class="times-note">${base} × ${factor} ＝ ${base*factor}<br>くりあがりの ${carry}も たして、<br>${base*factor} ＋ ${carry} ＝ <strong>${c.expected}</strong></p>`:''}${dividend!==undefined?`<p class="times-note">${base} × □ が ${dividend}を こえない、<br>いちばん 大きい □を さがそう。</p>`:''}</section>`;
 }else if(c.parts&&state.problem.op==='+')visual=`<div class="beads" aria-label="数を表す丸">${Array.from({length:c.parts.reduce((a,b)=>a+b,0)},(_,i)=>`<i class="bead ${i>=c.parts[0]?'alt':''}"></i>`).join('')}</div>`;
 modal(`<h2 id="dialog-title">いっしょに 考えよう</h2><p>${escape(c.message)}</p><p>${escape(c.hint||'右の位から じゅんに 計算しよう。')}</p>${visual}<button class="gloss green close" data-action="close">やってみる</button><button class="gloss sand close" data-action="reveal">こたえを みる</button>`);
}
$('keypad').innerHTML=[['7','7'],['8','8'],['9','9'],['+','＋'],['4','4'],['5','5'],['6','6'],['-','−'],['1','1'],['2','2'],['3','3'],['*','×'],['0','0'],['Backspace','⌫'],['/','÷'],['Enter','けってい']].map(([k,label])=>`<button class="gloss ${'+-*/'.includes(k)?'orange':k==='Enter'?'green confirm':k==='0'?'zero':k==='Backspace'?'gray':''}" data-key="${k}" aria-label="${k==='Backspace'?'一文字けす':label}">${label}</button>`).join('');
// Delete on contact rather than release, with one deletion per tap.
let deleteDelay,deleteRepeat;
function stopDelete(){clearTimeout(deleteDelay);clearInterval(deleteRepeat);}
$('keypad').addEventListener('pointerdown',e=>{
 const button=e.target.closest('[data-key="Backspace"]');
 if(!button||button.disabled||e.button!==0||!e.isPrimary)return;
 e.preventDefault();button.focus({preventScroll:true});key('Backspace');
 deleteDelay=setTimeout(()=>{deleteRepeat=setInterval(()=>key('Backspace'),80);},400);
});
for(const event of ['pointerup','pointercancel'])document.addEventListener(event,stopDelete);
window.addEventListener('blur',stopDelete);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopDelete();});
$('keypad').addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b&&!b.disabled){if(b.dataset.key==='Backspace'&&e.detail>0)return;key(b.dataset.key);}});
$('undo').onclick=()=>{if(!history.length)return;future.push(copy(state));restore(history.pop());sound();};
$('redo').onclick=()=>{if(!future.length)return;history.push(copy(state));restore(future.pop());sound();};
$('reset').onclick=()=>{if(!state.formula&&!plan)return;modal('<h2 id="dialog-title">はじめから やりなおす？</h2><p>いまの式を けして、あたらしい式を 入れられるよ。</p><button class="gloss sand close" data-action="new">リセットする</button><button class="gloss gray close" data-action="close">このまま つづける</button>');};
$('settings').onclick=showSettings;
function action(e){const b=e.target.closest('[data-action],[data-setting]');if(!b)return;sound();if(b.dataset.setting){const name=b.dataset.setting;settings[name]=name==='sound'?b.dataset.value==='true':b.dataset.value;if(plan)plan=buildPlan(state.problem,settings);close();render();showSettings();return;}switch(b.dataset.action){case'close':close();break;case'next':confirm();break;case'new':close();reset();break;case'retry':snapshot();state.index=0;state.input='';stopFeedback();render();break;case'hint':hint();break;case'reveal':{const c=current();close();feedback=`こたえは ${c.expected}だよ。赤いわくに 入れてみよう。`;feedbackType='';render();break;}}}
$('actions').addEventListener('click',action);$('dialog-content').addEventListener('click',action);
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
document.addEventListener('keydown',e=>{if($('dialog').open)return;const k=e.key==='Delete'?'Backspace':e.key==='x'?'*':e.key;if(/^[0-9+\-*/]$/.test(k)||['Enter','Backspace'].includes(k)){e.preventDefault();key(k);}});
render();

// Use a compact workspace first; only scale for genuinely smaller windows.
// Measure the unscaled layout so zoom never compounds when the size changes.
let fitFrame;
function fitToScreen(){
 cancelAnimationFrame(fitFrame);
 fitFrame=requestAnimationFrame(()=>{
  const app=$('app');
  const viewportWidth=document.documentElement.clientWidth;
  const viewportHeight=window.visualViewport?.height||window.innerHeight;
  const naturalWidth=viewportWidth<=760?Math.max(320,viewportWidth-20):Math.min(900,viewportWidth-32);
  app.style.width=naturalWidth+'px';
  const scale=Math.min(1,(viewportWidth-24)/naturalWidth,(viewportHeight-32)/Math.max(app.offsetHeight,app.scrollHeight));
  app.style.setProperty('--app-scale',Math.max(.1,scale));
 });
}
window.addEventListener('resize',fitToScreen);
window.visualViewport?.addEventListener('resize',fitToScreen);
new ResizeObserver(fitToScreen).observe($('app'));
document.fonts?.ready.then(fitToScreen);
fitToScreen();

})();
